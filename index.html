<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чек-лист оборудования</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" href="icon.png?v=2">
</head>
<body>
    <div class="phone-container">
        <header><h1 id="main-title" class="title">Смены</h1></header>
        <div id="progress-container-block" class="progress-section hidden">
            <div class="progress-text">
                <span id="progress-count">Собрано: 0 / 0</span>
                <span id="progress-percent" class="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg"><div id="progress-fill" class="progress-bar-fill"></div></div>
        </div>
        <div id="main-content-area"></div>
        <nav>
            <button id="nav-shifts" class="nav-item active" onclick="switchTab('shifts')"><span>📅</span><span>Смены</span></button>
            <button id="nav-inventory" class="nav-item" onclick="switchTab('inventory')"><span>📦</span><span>Склад</span></button>
            <button id="nav-templates" class="nav-item" onclick="switchTab('templates')"><span>📋</span><span>Шаблоны</span></button>
        </nav>
    </div>
    <script src="data.js"></script>
    <script src="render.js"></script>
    <script>
    let currentTab='shifts',activeShiftId=null,activeTemplateId=null;
    function switchTab(t){currentTab=t;activeShiftId=null;activeTemplateId=null;document.querySelectorAll('nav .nav-item').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+t).classList.add('active');renderAll();}
    function toggleCategoryCollapse(k){collapsedCats[k]=!collapsedCats[k];saveAll();renderAll();}
    function handleCategoryAdd(categoryKey){
        const arr=(currentTab==='inventory')?warehouseItems:(currentTab==='shift-detail')?shiftsList.find(s=>s.id===activeShiftId)?.items:templatesList.find(t=>t.id===activeTemplateId)?.items;if(!arr)return;
        arr.push({id:Date.now(),name:prompt("Название прибора:").trim(),brand:prompt("Бренд:")||"Без бренда",count:(currentTab==='inventory')?0:(parseInt(prompt("Количество:","1"))||1),packed:false,category:categoryKey,subcategory:prompt("Подкатегория:","Разное").trim(),section:""});saveAll();renderAll();
    }
    function createShiftFromTemplate(tplId){
        const tpl=templatesList.find(t=>t.id===tplId);if(!tpl)return;const name=prompt(`Название смены для "${tpl.name}":`);if(!name||!name.trim())return;
        shiftsList.push({id:Date.now(),name:name.trim(),date:prompt("Дата смены:",new Date().toLocaleDateString('ru-RU'))||"",items:tpl.items.map(i=>({...i,id:Date.now()+Math.random(),packed:false,count:i.count>0?i.count:1}))});saveAll();switchTab('shifts');
    }
    function saveShiftAsTemplate(shiftId,e){
        e.stopPropagation();const s=shiftsList.find(x=>x.id===shiftId);if(!s)return;const n=prompt("Название шаблона:",`Шаблон: ${s.name}`);if(!n||!n.trim())return;
        templatesList.push({id:'tpl_'+Date.now(),name:n.trim(),desc:prompt("Описание:")||"Из смены",items:s.items.map(i=>({...i,id:Date.now()+Math.random(),packed:false}))});saveAll();switchTab('templates');
    }
    function createTemplateFromWarehouse(){
        const chosen=warehouseItems.filter(i=>i.packed);if(!chosen.length){alert("На Складе ничего не выбрано!");return;}
        templatesList.push({id:'tpl_'+Date.now(),name:prompt("Название шаблона:").trim(),desc:prompt("Описание:"),items:chosen.map(i=>({...i,id:Date.now()+Math.random(),packed:false,count:i.count>0?i.count:1}))});warehouseItems.forEach(i=>i.packed=false);saveAll();renderAll();
    }
    function toggleItemPacked(id){
        const arr=(currentTab==='inventory')?warehouseItems:shiftsList.find(s=>s.id===activeShiftId)?.items;
        if(arr){const i=arr.find(x=>x.id===id);if(i)i.packed=!i.packed;}saveAll();renderAll();
    }
    function deleteGlobalItem(id,e){
        if(e)e.stopPropagation();if(currentTab==='inventory')warehouseItems=warehouseItems.filter(x=>x.id!==id);if(currentTab==='shifts')shiftsList=shiftsList.filter(x=>x.id!==id);if(currentTab==='templates')templatesList=templatesList.filter(x=>x.id!==id);
        if(currentTab==='shift-detail'){const s=shiftsList.find(x=>x.id===activeShiftId);if(s)s.items=s.items.filter(x=>x.id!==id);}if(currentTab==='template-detail'){const t=templatesList.find(x=>x.id===activeTemplateId);if(t)t.items=t.items.filter(x=>x.id!==id);}saveAll();renderAll();
    }
    function renderAll(){
        const t=document.getElementById("main-title"),p=document.getElementById("progress-container-block"),c=document.getElementById("main-content-area");p.classList.add("hidden");
        if(currentTab==='shifts'){
            t.innerText="Смены";if(!shiftsList.length){c.innerHTML=`<div class="empty-text">Список смен пуст. Сформируйте смену на Складе.</div>`;return;}
            c.innerHTML=shiftsList.map(s=>`<div class="card" style="margin-top:12px;display:flex;flex-direction:column;padding:16px;box-sizing:border-box;cursor:pointer;" onclick="currentTab='shift-detail';activeShiftId=${s.id};renderAll();"><div style="font-size:17px;font-weight:600;color:#ffffff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;"><span>${s.name}</span><span style="color:#71717a;font-size:14px;">▶</span></div><div style="height:1px;background-color:#27272a;margin-bottom:10px;width:100%;"></div><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:13px;color:#a1a1aa;">📅 ${s.date}</span><span style="font-size:12px;color:#10b981;font-weight:500;">Собрано: ${s.items.reduce((a,i)=>a+(i.packed?i.count:0),0)}/${s.items.reduce((a,i)=>a+i.count,0)}</span></div><div style="display:flex;align-items:center;gap:12px;"><button class="subtle-delete" style="color:#3b82f6;font-size:16px;padding:6px;background:#27272a;border-radius:6px;" onclick="saveShiftAsTemplate(${s.id},event)">📋</button><button style="background:#2a1414;border:1px solid #3d1b1b;color:#ef4444;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:6px 12px;border-radius:6px;cursor:pointer;" onclick="event.stopPropagation();if(confirm('Удалить проект навсегда?')){deleteGlobalItem(${s.id},event)}">Удалить</button></div></div></div>`).join('');
        }else if(currentTab==='inventory'){
            t.innerText="Каталог Склада";c.innerHTML=buildHtml(warehouseItems)+`<button onclick="checkoutToShiftFlex()" class="big-green-btn">Взять на смену!</button>`;
        }else if(currentTab==='templates'){
            t.innerText="Шаблоны";c.innerHTML=buildTemplatesHtml();
        }else if(currentTab==='shift-detail'){
            const s=shiftsList.find(x=>x.id===activeShiftId);if(!s){switchTab('shifts');return;}t.innerText=s.name;p.classList.remove("hidden");c.innerHTML=`<button class="back-btn" onclick="switchTab('shifts')" style="margin-bottom:10px;background:#27272a;border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;">❮ К списку смен</button>`+buildHtml(s.items);
        }else if(currentTab==='template-detail'){
            const tpl=templatesList.find(x=>x.id===activeTemplateId);if(!tpl){switchTab('templates');return;}t.innerText=`Пресет: ${tpl.name}`;c.innerHTML=`<button class="back-btn" onclick="switchTab('templates')" style="margin-bottom:10px;background:#27272a;border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;">❮ К шаблонам</button>`+buildHtml(tpl.items||[]);
        }
    }
    renderAll();
    </script>
</body>
</html>
