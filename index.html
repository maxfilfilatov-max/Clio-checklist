<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Чек-лист оборудования</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="phone-container">
        <header>
            <h1 id="main-title" class="title">Смены</h1>
        </header>

        <!-- ИСПРАВЛЕНО: Восстановили правильную структуру прогресс-бара для шапки смены -->
        <div id="progress-container-block" class="progress-section hidden">
            <div class="progress-text">
                <span id="progress-count">Собрано: 0 / 0</span>
                <span id="progress-percent" class="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
        </div>

        <div id="main-content-area"></div>

        <nav>
            <button id="nav-shifts" class="nav-item active" onclick="switchTab('shifts')">
                <span>📅</span>
                <span>Смены</span>
            </button>
            <button id="nav-inventory" class="nav-item" onclick="switchTab('inventory')">
                <span>📦</span>
                <span>Склад</span>
            </button>
            <button id="nav-templates" class="nav-item" onclick="switchTab('templates')">
                <span>📋</span>
                <span>Шаблоны</span>
            </button>
        </nav>
    </div>
    <script src="data.js"></script>
    <script src="render.js"></script>
    <script src="app.js"></script>
</body>
</html>
